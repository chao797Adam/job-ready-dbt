version: 2

models:
  - name: stg_orders
    description: "Staging view of orders. One row per order."
    columns:
      - name: order_id
        description: "Unique order identifier"
        tests: [unique, not_null]
      - name: customer_id
        description: "Foreign key to customer"
        tests:
          - not_null
          - relationships:
              to: ref('scd_customers')  
              field: customer_id
              config:                 # newly added
                severity: warn        # newly added

  - name: stg_order_items
    description: "Staging view of order items."
    columns:
      - name: order_item_id
        tests: [unique, not_null]
      - name: order_id
        tests: [not_null]

  - name: stg_products
    description: "Staging view of products. Trimmed and cast, then deduplicated to one row per product_id (latest updated_at). SCD2 history lives in the scd_products snapshot, not here."
    columns:
      - name: product_id
        tests: [unique, not_null]
