version: 2

models:
  - name: int_order_items_with_products
    description: "Line-item grain intermediate model. Enriched with product and order metadata."
    columns:
      - name: order_item_id
        description: "Primary key at the line-item grain."
        data_tests:
          - unique
          - not_null

  - name: int_orders_enriched
    description: "Order grain intermediate model. Pre-aggregated item metrics and joined with active SCD customer records."
    columns:
      - name: order_id
        description: "Primary key at the order grain."
        data_tests:
          - unique
          - not_null